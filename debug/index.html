<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>debug</title><meta name="robots" content="noindex" /></head>
  <body style="margin:0;background:#666;display:flex;justify-content:center;padding:24px;">
    <div>
      <p style="color:#fff;font-family:sans-serif;">DEBUG — overflow elements outlined RED</p>
      <iframe id="f" src="/ricsline/en/" style="width:390px;height:2000px;border:3px solid red;background:#fff;"></iframe>
    </div>
    <script>
      const f = document.getElementById('f');
      f.addEventListener('load', () => {
        setTimeout(() => {
          const doc = f.contentDocument;
          const vw = f.contentWindow.innerWidth;
          let html = '<div style="position:fixed;top:0;left:0;background:#000;color:#fff;z-index:9999;font:12px monospace;padding:8px;max-width:380px;max-height:300px;overflow:auto;">';
          html += 'viewport=' + vw + '<br>';
          doc.querySelectorAll('*').forEach((el) => {
            const r = el.getBoundingClientRect();
            if (r.width > vw + 1 && r.width < 5000) {
              el.style.outline = '3px solid red';
              const cls = (el.className && el.className.baseVal !== undefined) ? '' : String(el.className).split(' ').slice(0, 4).join('.');
              html += 'WIDE(' + Math.round(r.width) + '): &lt;' + el.tagName.toLowerCase() + ' class="' + cls + '"&gt;<br>';
            }
          });
          html += '</div>';
          doc.body.insertAdjacentHTML('beforeend', html);
        }, 3000);
      });
    </script>
  </body>
</html>
